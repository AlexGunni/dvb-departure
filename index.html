<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Abfahrten">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23063971'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='19' fill='white'>22</text></svg>">
<title>Abfahrten</title>
<style>
  :root {
    --board: #0A0B0D;
    --rule: #24272E;
    --amber: #FFAF14;
    --amber-dim: #8A6415;
    --text: #E8E4DA;
    --muted: #7C8088;
    --red: #FF5347;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html { background: var(--board); }

  body {
    margin: 0 auto;
    max-width: 620px;
    padding: 0 0 32px;
    background: var(--board);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Kopfzeile ---------- */

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--board);
    border-bottom: 1px solid var(--rule);
    padding: 16px 14px 12px;
    padding-top: calc(env(safe-area-inset-top) + 16px);
  }

  .head-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .place {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber-dim);
    margin: 0;
  }

  .clock {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--muted);
  }

  .status[data-stale] { color: var(--red); }

  .refresh {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
    background: transparent;
    border: 1px solid var(--amber-dim);
    padding: 5px 10px;
    cursor: pointer;
  }

  .refresh:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .refresh:disabled { opacity: 0.4; cursor: default; }

  /* ---------- Haltestellenblock ---------- */

  .stop { border-bottom: 1px solid var(--rule); }

  .stop-name {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber-dim);
    margin: 0;
    padding: 16px 14px 10px;
  }

  .stop-msg {
    color: var(--muted);
    font-size: 12.5px;
    padding: 0 14px 16px;
  }

  .stop-msg[data-error] { color: var(--red); }

  /* ---------- Spalten ---------- */

  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding-bottom: 12px;
  }

  .col { min-width: 0; }

  .col + .col { border-left: 1px solid var(--rule); }

  .col[data-wide] { grid-column: 1 / -1; }

  .col-head {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 12px 6px 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- Abfahrtszeile ---------- */

  .dep {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 8px;
    padding: 6px 12px 6px 14px;
  }

  .line {
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* Bahn: gefuellte Flaeche. Bus: nur Kontur. Unterschied ohne zweite Farbe. */
  .line[data-mot="tram"] {
    background: var(--amber);
    color: var(--board);
    padding: 2px 0;
  }

  .line[data-mot="bus"] {
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    padding: 1px 0;
  }

  .dest {
    font-size: 12px;
    color: var(--text);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .when {
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .mins {
    font-size: 14px;
    font-weight: 700;
    color: var(--amber);
  }

  .unit {
    font-size: 10px;
    font-weight: 400;
    color: var(--amber-dim);
    margin-left: 2px;
  }

  .delay {
    display: block;
    font-size: 10px;
    color: var(--red);
    letter-spacing: 0.04em;
  }

  /* Zu Fuss nicht mehr erreichbar */
  .dep[data-unreachable] .mins,
  .dep[data-unreachable] .dest { color: var(--muted); }
  .dep[data-unreachable] .line[data-mot="tram"] { background: var(--rule); color: var(--muted); }
  .dep[data-unreachable] .line[data-mot="bus"] { border-color: var(--rule); color: var(--muted); }

  /* Fahrt faellt aus */
  .dep[data-cancelled] .dest { text-decoration: line-through; color: var(--muted); }
  .dep[data-cancelled] .mins { color: var(--red); font-size: 11px; }

  footer {
    color: var(--muted);
    font-size: 11px;
    padding: 16px 14px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <p class="place">Dresden</p>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="status" id="status">
    <span id="status-text">Lade …</span>
    <button class="refresh" id="refresh">Neu laden</button>
  </div>
</header>

<main id="board"></main>

<footer>Daten: VVO · inoffizielle Schnittstelle</footer>

<script>
(function () {
  "use strict";

  /* ===== Einstellungen =================================================

     id     Haltestellen-ID. Fehlt sie, sucht die Seite beim Start
            einmal über den Pointfinder und schreibt die gefundene ID
            in die Konsole – von dort kannst du sie hier eintragen.

     walk   Minuten Fußweg. Abfahrten, die du nicht mehr erreichst,
            werden ausgegraut statt versteckt. 0 = aus.

     steige Beschriftung der Spalten, nach Steig-Nummer der API.
            Leer lassen, dann steht dort "Steig 1" / "Steig 2".
            Beispiel: { "1": "stadtauswärts", "2": "stadteinwärts" }

  ====================================================================== */

  var STOPS = [
    { name: "Burgkstraße",       id: "33000172", walk: 0, steige: {} },
    { name: "Tharandter Straße", id: "33000144", walk: 0, steige: {} },
    { name: "Bünaustraße",       id: "33000145", walk: 0, steige: {} },
    { name: "Conertplatz",       id: null,       walk: 0, steige: {} }
  ];

  var LIMIT       = 12;     // Abfahrten pro Haltestelle abrufen
  var PER_COLUMN  = 4;      // davon je Spalte anzeigen
  var REFRESH_MS  = 30000;  // Abruf alle 30 s
  var TICK_MS     = 5000;   // Countdown lokal alle 5 s neu rechnen
  var STALE_MS    = 90000;  // ab hier gilt die Anzeige als veraltet

  var DM          = "https://webapi.vvo-online.de/dm";
  var POINTFINDER = "https://webapi.vvo-online.de/tr/pointfinder";

  var state   = STOPS.map(function () { return { deps: [], error: null }; });
  var lastOk  = null;
  var loading = false;

  function $(id) { return document.getElementById(id); }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function post(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  function parseVvoDate(raw) {
    if (!raw) return null;
    var m = /\/Date\((\d+)/.exec(raw);
    return m ? parseInt(m[1], 10) : null;
  }

  /* ---------- IDs nachschlagen ---------- */

  function resolveStop(stop, i) {
    return post(POINTFINDER, { query: stop.name, stopsOnly: true, limit: 8 })
      .then(function (data) {
        var points = data.Points || [];
        for (var k = 0; k < points.length; k++) {
          var f = String(points[k]).split("|");
          var id = f[0], city = f[2] || "Dresden", label = f[3] || "";
          if (id.indexOf("33") === 0 && city === "Dresden") {
            stop.id = id;
            if (label) stop.name = label;
            console.info("Haltestelle aufgelöst: " + label + " → " + id +
                         "  (fest eintragen spart die Suche beim Start)");
            return;
          }
        }
        state[i].error = "nicht gefunden";
      })
      .catch(function (err) { state[i].error = err.message; });
  }

  function resolveAll() {
    var open = STOPS.map(function (s, i) { return s.id ? null : resolveStop(s, i); })
                    .filter(Boolean);
    return Promise.all(open);
  }

  /* ---------- Abruf ---------- */

  function fetchStop(stop) {
    return post(DM, { stopid: stop.id, limit: LIMIT }).then(function (data) {
      return (data.Departures || []).map(function (d) {
        var sched = parseVvoDate(d.ScheduledTime);
        var real  = parseVvoDate(d.RealTime) || sched;
        return {
          line:      d.LineName || "?",
          dest:      d.Direction || "",
          mot:       d.Mot === "Tram" ? "tram" : "bus",
          steig:     (d.Platform && d.Platform.Name) ? String(d.Platform.Name) : "",
          at:        real,
          delay:     (sched && real) ? Math.round((real - sched) / 60000) : 0,
          cancelled: d.State === "Cancelled"
        };
      }).filter(function (d) { return d.at; });
    });
  }

  function load() {
    if (loading) return;
    loading = true;
    $("refresh").disabled = true;

    Promise.all(STOPS.map(function (stop, i) {
      if (!stop.id) return Promise.resolve();
      return fetchStop(stop)
        .then(function (deps) { state[i] = { deps: deps, error: null }; })
        .catch(function (err) { state[i].error = err.message; });
    }))
    .then(function () {
      if (state.some(function (s) { return !s.error; })) lastOk = Date.now();
      loading = false;
      $("refresh").disabled = false;
      render();
    });
  }

  /* ---------- Nach Steig gruppieren ---------- */

  function byPlatform(deps) {
    var map = {}, keys = [];
    deps.forEach(function (d) {
      if (!(d.steig in map)) { map[d.steig] = []; keys.push(d.steig); }
      map[d.steig].push(d);
    });
    keys.sort(function (a, b) {
      var na = parseInt(a, 10), nb = parseInt(b, 10);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return a < b ? -1 : a > b ? 1 : 0;
    });
    return keys.map(function (k) { return { steig: k, deps: map[k] }; });
  }

  function columnLabel(stop, steig) {
    if (stop.steige && stop.steige[steig]) return stop.steige[steig];
    return steig ? "Steig " + steig : "Alle Richtungen";
  }

  /* ---------- Anzeige ---------- */

  function depRow(d, now, stop) {
    var mins = Math.round((d.at - now) / 60000);
    var row  = el("div", "dep");

    if (d.cancelled) row.setAttribute("data-cancelled", "");
    else if (stop.walk > 0 && mins < stop.walk) row.setAttribute("data-unreachable", "");

    var line = el("span", "line", d.line);
    line.setAttribute("data-mot", d.mot);

    var when = el("span", "when");
    if (d.cancelled) {
      when.appendChild(el("span", "mins", "fällt aus"));
    } else {
      var m = el("span", "mins");
      if (mins === 0) {
        m.textContent = "jetzt";
      } else {
        m.textContent = mins;
        m.appendChild(el("span", "unit", "min"));
      }
      when.appendChild(m);
      if (d.delay >= 1) when.appendChild(el("span", "delay", "+" + d.delay));
    }

    row.appendChild(line);
    row.appendChild(el("span", "dest", d.dest));
    row.appendChild(when);
    return row;
  }

  function render() {
    var now   = Date.now();
    var board = $("board");
    board.textContent = "";

    STOPS.forEach(function (stop, i) {
      var block = el("section", "stop");
      block.appendChild(el("h2", "stop-name", stop.name));

      var s = state[i];

      // Fehler nur zeigen, wenn gar nichts mehr da ist. Sonst bleiben
      // die alten Daten stehen und der Kopf meldet "veraltet".
      if (s.error && !s.deps.length) {
        var e = el("p", "stop-msg", "Nicht erreichbar · " + s.error);
        e.setAttribute("data-error", "");
        block.appendChild(e);
        board.appendChild(block);
        return;
      }

      var upcoming = s.deps.filter(function (d) {
        return Math.round((d.at - now) / 60000) >= 0;
      });

      if (!upcoming.length) {
        block.appendChild(el("p", "stop-msg", "Keine Abfahrten"));
        board.appendChild(block);
        return;
      }

      var groups = byPlatform(upcoming);
      var cols   = el("div", "cols");

      groups.forEach(function (g) {
        var col = el("div", "col");
        // Liefert die API keine Steige, wird eine Spalte über die volle Breite gesetzt
        if (groups.length === 1) col.setAttribute("data-wide", "");
        col.appendChild(el("p", "col-head", columnLabel(stop, g.steig)));
        g.deps.slice(0, PER_COLUMN).forEach(function (d) {
          col.appendChild(depRow(d, now, stop));
        });
        cols.appendChild(col);
      });

      block.appendChild(cols);
      board.appendChild(block);
    });

    updateStatus();
  }

  function updateStatus() {
    var d = new Date();
    $("clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());

    var status = $("status");
    var text   = $("status-text");

    if (!lastOk) {
      status.removeAttribute("data-stale");
      return;
    }

    var age = Date.now() - lastOk;

    if (age > STALE_MS) {
      status.setAttribute("data-stale", "");
      text.textContent = "Veraltet · Stand " +
        new Date(lastOk).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    } else {
      status.removeAttribute("data-stale");
      text.textContent = age < 10000 ? "Aktuell" : "Aktualisiert vor " + Math.round(age / 1000) + " s";
    }
  }

  /* ---------- Takt ---------- */

  $("refresh").addEventListener("click", load);

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) load();   // nach Rückkehr aus dem Hintergrund sofort frisch
  });

  setInterval(load, REFRESH_MS);
  setInterval(render, TICK_MS);

  $("status-text").textContent = "Suche Haltestellen …";
  resolveAll().then(load);
})();
</script>
</body>
</html>
